name: Update Ensifera data

on:
  schedule:
    - cron: '7 * * * *'  # cada hora
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch data from Ensifera Worker
        run: python scripts/fetch_ensifera.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ensifera.json && git ls-files --error-unmatch ensifera.json >/dev/null 2>&1; then
            echo "No changes"
          else
            git add ensifera.json
            git commit -m "chore: update ensifera data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
