<title>JK Marketing · Panel de Clientes</title>
<style>
/* ── Tokens ── */
:root {
  --bg:#0b0e14; --surf:#141821; --card:#1c2130; --card2:#202840;
  --border:#2a3142; --ink:#e8eaf0; --ink2:#8891a8; --ink3:#3d4760;
  --green:#3ecf8e; --red:#f56565; --gold:#f0b429;
  --radius:12px; --rad-sm:8px;
  --shad:0 4px 24px #00000060; --t:.18s ease;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f0f2f8; --surf:#fff; --card:#fff; --card2:#edf0f8;
  --border:#dde2ed; --ink:#1a1f2e; --ink2:#5a607a; --ink3:#c5cbda;
  --shad:0 4px 24px #0000001a;
}}
:root[data-theme="light"]{--bg:#f0f2f8;--surf:#fff;--card:#fff;--card2:#edf0f8;--border:#dde2ed;--ink:#1a1f2e;--ink2:#5a607a;--ink3:#c5cbda;--shad:0 4px 24px #0000001a;}
:root[data-theme="dark"]{--bg:#0b0e14;--surf:#141821;--card:#1c2130;--card2:#202840;--border:#2a3142;--ink:#e8eaf0;--ink2:#8891a8;--ink3:#3d4760;--shad:0 4px 24px #00000060;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;min-height:100vh;transition:background var(--t),color var(--t);}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
input{font:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px;height:54px;}
.hdr-logo{font-weight:800;font-size:15px;letter-spacing:-.4px;}
.hdr-logo em{font-style:normal;opacity:.45;font-weight:400;}
.hdr-spacer{flex:1;}
.sync-row{display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s;}
.dot.loading{background:var(--gold);animation:blink 1s infinite;}
.dot.err{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.sync-lbl{font-size:11px;color:var(--ink2);}
.hdr-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink2);transition:all var(--t);}
.hdr-btn:hover{background:var(--card2);color:var(--ink);}

/* ── Date bar ── */
.dbar{background:var(--surf);border-bottom:1px solid var(--border);padding:7px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;}
.pb{padding:4px 9px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink2);border:1px solid transparent;transition:all var(--t);}
.pb:hover{background:var(--card2);color:var(--ink);}
.pb.on{background:var(--card2);border-color:var(--border);color:var(--ink);}
.dsep{color:var(--ink3);margin:0 3px;font-size:12px;}
.dinput{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:12px;outline:none;color:var(--ink);}
.dinput:focus{border-color:#6366f1;}
.dright{margin-left:auto;display:flex;align-items:center;gap:5px;}

/* ── Main ── */
.main{padding:18px;max-width:1360px;margin:0 auto;}

/* ── Home stats strip ── */
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.hstat{background:var(--card);border:1px solid var(--border);border-radius:var(--rad-sm);padding:12px 14px;}
.hstat-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);margin-bottom:3px;}
.hstat-val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}

/* ── Client cards ── */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px;}
.ccard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:transform var(--t),box-shadow var(--t),border-color var(--t);position:relative;overflow:hidden;}
.ccard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--cc);}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--shad);border-color:var(--cc);}
.ccard-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.cname{font-weight:700;font-size:15px;}
.csub{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;align-items:center;gap:4px;}
.csub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cc);flex-shrink:0;}
.cicon{font-size:22px;}
.ctotal{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-bottom:4px;}
.ckpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.ck-lbl{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2);margin-bottom:2px;}
.ck-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--ink2);}
.ccta{font-size:12px;font-weight:600;color:var(--cc);}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--border) 25%,var(--card2) 50%,var(--border) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:5px;}
@keyframes shim{0%{background-position:200%}100%{background-position:-200%}}

/* ── Badges ── */
.bdg{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:20px;font-size:11px;font-weight:600;}
.bdg.up{background:#3ecf8e22;color:var(--green);}
.bdg.dn{background:#f5656522;color:var(--red);}
.bdg.nu{background:var(--card2);color:var(--ink2);}

/* ── Detail header ── */
.dhdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.backbtn{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2);background:var(--card);border:1px solid var(--border);transition:all var(--t);}
.backbtn:hover{background:var(--card2);color:var(--ink);}
.dstripe{width:4px;height:38px;border-radius:2px;background:var(--cc);flex-shrink:0;}
.dtitle{font-size:18px;font-weight:800;}
.dsub{font-size:12px;color:var(--ink2);margin-top:2px;}

/* ── KPI Row ── */
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px;}
.ktile{background:var(--card);border:1px solid var(--border);border-radius:var(--rad-sm);padding:12px 14px;}
.kt-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);margin-bottom:4px;}
.kt-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1.2;}
.kt-val.grn{color:var(--green);}
.kt-val.gld{color:var(--gold);}
.kt-val.red{color:var(--red);}
.kt-sub{font-size:11px;color:var(--ink2);margin-top:4px;}

/* ── Sections ── */
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;margin-bottom:12px;}
.sec-ttl{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.sec-ttl span{font-weight:400;letter-spacing:0;color:var(--ink3);}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.dfull{grid-column:1/-1;}

/* ── Bar rows ── */
.brow{margin-bottom:9px;}
.brow:last-child{margin-bottom:0;}
.bmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.bname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;}
.bval{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);}
.btrack{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bfill{height:100%;border-radius:3px;transition:width .5s ease;}

/* ── Chart ── */
.chart-wrap{overflow-x:auto;overflow-y:hidden;}

/* ── Proj strip ── */
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.pitem{background:var(--card);border:1px solid var(--border);border-radius:var(--rad-sm);padding:11px 13px;}
.pi-lbl{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2);margin-bottom:4px;}
.pi-val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px;}

/* ── ROAS ── */
.roas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.rrow{background:var(--card2);border:1px solid var(--border);border-radius:var(--rad-sm);padding:12px 14px;}
.r-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);margin-bottom:8px;}
.rinput-w{display:flex;align-items:center;gap:5px;margin-bottom:8px;}
.rinput{flex:1;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:13px;outline:none;color:var(--ink);}
.rinput:focus{border-color:#6366f1;}
.rres{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:3px;}
.rresv{font-weight:700;font-variant-numeric:tabular-nums;}

/* ── Month tabs ── */
.mtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.mtab{padding:4px 9px;border-radius:5px;font-size:12px;color:var(--ink2);border:1px solid transparent;transition:all var(--t);}
.mtab:hover{background:var(--card2);color:var(--ink);}
.mtab.on{background:var(--card2);border-color:var(--border);color:var(--ink);}

/* ── Table ── */
.twrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--card2);}
.chip{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;}

/* ── Recaudo progress ── */
.recaudo-bar{margin-top:12px;}
.rec-vals{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.rec-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
.rec-fill{height:100%;border-radius:4px;background:var(--green);transition:width .5s;}

/* ── Responsive ── */
@media(max-width:640px){
  .dgrid{grid-template-columns:1fr;}
  .cgrid{grid-template-columns:1fr;}
  .krow{grid-template-columns:repeat(2,1fr);}
  .hstats{grid-template-columns:repeat(2,1fr);}
}
</style>

<script>
// ============================================================
// CONFIG
// ============================================================
const SHEETS={
  muebles:'1HRqhDS_63PWVutrRCHbEVEFtk0-n_r86ErlBMpAc0KE',
  colchones:'1puftbarNBpZJu6ELGeZWutnnU_W71b0-yuPQW5q14mk',
  lili:'1DQO1nI8ucA8eiEGPKtxCk0PfTBJC3PMWWC8Zu5AWqqk',
  stetic:'1kS6p77KnWTO5KKM5OezklTgi219TMRT5aZtqahYu2YU',
};
const LILI_TRACKING_URL='https://docs.google.com/spreadsheets/d/1DQO1nI8ucA8eiEGPKtxCk0PfTBJC3PMWWC8Zu5AWqqk/export?format=csv&gid=320870210';
const MES_ES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const MES_SHORT=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Inversión mensual fija en ads (COP) por cliente
const INVERSION_FIJA={
  imperial:  1000000,
  elrey:     2400000,
  col_car:   2000000,
  col_cer:   6000000,
  lili:      2000000,
  stetic:    450000,
  // ensifera: inversión real extraída del dashboard
};

const CLIENTS=[
  {id:'imperial',  name:'Muebles Imperial',  sub:'Jamundí',       icon:'🛋', cc:'#9b6dff', sheet:'muebles',   type:'muebles',  sede:'JAMUNDÍ'},
  {id:'elrey',     name:'Muebles El Rey',     sub:'Cerritos',      icon:'🪑', cc:'#f0b429', sheet:'muebles',   type:'muebles',  sede:'CERRITOS'},
  {id:'col_car',   name:'Colchones El Rey',   sub:'Cartago',       icon:'🛏', cc:'#3ecf8e', sheet:'colchones', type:'muebles',  sede:'CARTAGO'},
  {id:'col_cer',   name:'Colchones El Rey',   sub:'Pereira',       icon:'🛏', cc:'#4da6ff', sheet:'colchones', type:'muebles',  sede:'CERRITOS'},
  {id:'lili',      name:'Lili Valencia',      sub:'Online',        icon:'👠', cc:'#ff6b9d', sheet:'lili',      type:'lili'},
  {id:'stetic',    name:'Valencia Stetic',    sub:'Cali',          icon:'💆', cc:'#ff8c42', sheet:'stetic',    type:'stetic'},
  {id:'ensifera',  name:'Ensífera',           sub:'Col. Aviturismo',icon:'🦜', cc:'#81c784', type:'ensifera'},
];

// ============================================================
// STATE
// ============================================================
const ST={
  raw:{muebles:null,colchones:null,lili:null,liliTracking:null,stetic:null,ensifera:null},
  loading:{muebles:true,colchones:true,lili:true,stetic:true,ensifera:true},
  errors:{},
  view:'home',
  from:'',to:'',
  preset:'mes',
  ads:{},
  adsMonth:new Date().toISOString().slice(0,7),
  theme:'dark',
  syncing:false,
  lastSync:null,
};
try{ST.ads=JSON.parse(localStorage.getItem('jkm_ads')||'{}');}catch(e){}
try{const th=localStorage.getItem('jkm_theme');if(th)ST.theme=th;}catch(e){}

// ============================================================
// UTILS
// ============================================================
const $=id=>document.getElementById(id);

function fmt(n){
  if(!n&&n!==0)return'—';
  const a=Math.abs(n);
  if(a>=1e9)return'$'+(n/1e9).toFixed(1)+'B';
  if(a>=1e6)return'$'+(n/1e6).toFixed(1)+'M';
  if(a>=1e3)return'$'+(n/1e3).toFixed(0)+'K';
  return'$'+Math.round(n);
}
function fmtF(n){return'$'+new Intl.NumberFormat('es-CO').format(Math.round(n||0));}
function pm(s){if(!s)return 0;const c=String(s).replace(/[^0-9]/g,'');return c?parseInt(c,10):0;}
function toISO(s){
  s=(s||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function today(){return new Date().toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function diffDays(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function pct(cur,prev){if(!prev)return null;return(cur-prev)/prev*100;}
function fmtPct(p){if(p==null)return'—';return(p>=0?'+':'')+p.toFixed(1)+'%';}

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c==='\r'){}else f+=c;}}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}

function groupBy(arr,keyFn,valFn){
  const map={},cnt={};
  arr.forEach(r=>{const k=keyFn(r)||'—';map[k]=(map[k]||0)+(valFn?valFn(r):1);cnt[k]=(cnt[k]||0)+1;});
  return Object.entries(map).map(([name,val])=>({name,val,count:cnt[name]})).sort((a,b)=>b.val-a.val);
}

// ============================================================
// PARSERS
// ============================================================
function normSede(s){
  s=(s||'').trim().toUpperCase();
  if(s.startsWith('JAMUND'))return'JAMUNDÍ';
  if(s.startsWith('CERRITO'))return'CERRITOS';
  if(s.startsWith('CARTAGO'))return'CARTAGO';
  return s;
}

function parseMueRow(r){
  const iso=toISO(r[0]);if(!iso)return null;
  const isVenta=/^\s*s/i.test(r[4]||'')||r[4]==='1';
  // cols: [0]fecha [1]vendedor [2]sede [3]origen [4]venta [5]nPedido [6]producto [7]cedula ... [13]totalVenta [14]saldoPagado [15]saldoCobrar
  return{fecha:iso,vendedor:(r[1]||'').trim().toUpperCase(),sede:normSede(r[2]),origen:(r[3]||'').trim().toUpperCase(),isVenta,producto:(r[6]||'').trim().toUpperCase(),total:pm(r[13]),recaudado:pm(r[14])};
}

function parseLiliRow(r){
  const iso=toISO(r[0]);if(!iso)return null;
  const total=pm(r[6]);if(!total)return null;
  const valida=(r[22]||'').trim()==='1';
  return{fecha:iso,cliente:(r[1]||'').trim(),ciudad:(r[2]||'').trim().toUpperCase(),total,metodoPago:(r[7]||'').trim()||'Otro',canal:(r[8]||'').trim()||'Otro',tipo:(r[9]||'').trim()||'Otro',referencia:(r[11]||'').trim()||'—',estado:(r[17]||'').trim()||'Sin estado',asesor:(r[18]||'').trim()||'Sin asesor',valida};
}

function parseLiliTracking(content){
  // CSV cols: [0]Fecha [8]Contactos acum. [9]Cotizaciones acum. [10]Ventas acum. [11]Valor acum.
  const rows=parseCSV(content);if(rows.length<2)return[];
  const pi=s=>parseInt((s||'').replace(/[^0-9]/g,''))||0;
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];const date=(r[0]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
    out.push({date,c_acum:pi(r[8]),q_acum:pi(r[9]),v_acum:pi(r[10]),val_acum:pi(r[11])});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function parseSteticRow(r){
  const iso=toISO(r[0]);if(!iso)return null;
  const servicio=(r[4]||'').trim();
  const cliente=(r[3]||'').trim();
  if(!servicio&&!cliente)return null;
  return{fecha:iso,chats:parseInt(r[1])||0,nAgendados:parseInt(r[2])||0,cliente,servicio,valorAgendado:pm(r[5]),asistio:(r[6]||'').trim(),valorRecaudado:pm(r[7]),obs:(r[8]||'').trim()};
}

// ============================================================
// FETCH
// ============================================================
function gvizURL(id,tab,t){
  let u=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`;
  if(tab)u+=`&sheet=${encodeURIComponent(tab)}`;
  u+=`&t=${t||Date.now()}`;
  return u;
}

async function fetchMonthlySh(sheetKey,parserFn){
  const id=SHEETS[sheetKey];const t=Date.now();
  const jobs=MES_ES.map(m=>fetch(gvizURL(id,m,t)).then(r=>r.ok?r.text():'').catch(()=>''));
  const texts=await Promise.all(jobs);
  const seen={};let all=[];
  texts.forEach(tx=>{
    if(!tx||tx.trim().length<20)return;
    const fp=tx.slice(0,300); // fingerprint — avoids gviz micro-variations bloating dedup key
    if(seen[fp])return;seen[fp]=1;
    const rows=parseCSV(tx);
    for(let i=1;i<rows.length;i++){const p=parserFn(rows[i]);if(p)all.push(p);}
  });
  return all;
}

async function fetchLili(){
  const id=SHEETS.lili;const t=Date.now();
  const tx=await fetch(gvizURL(id,'BASE_VENTAS',t)).then(r=>r.ok?r.text():'').catch(()=>'');
  if(!tx)return[];
  const rows=parseCSV(tx);const out=[];
  for(let i=1;i<rows.length;i++){const p=parseLiliRow(rows[i]);if(p)out.push(p);}
  return out;
}

async function fetchLiliTracking(){
  const tx=await fetch(LILI_TRACKING_URL+'&t='+Date.now()).then(r=>r.ok?r.text():'').catch(()=>'');
  return tx?parseLiliTracking(tx):[];
}

async function fetchStetic(){
  const id=SHEETS.stetic;const t=Date.now();
  // Try monthly tabs + default sheet; deduplicate
  const tabs=[...MES_ES,''];
  const jobs=tabs.map(m=>fetch(gvizURL(id,m,t)).then(r=>r.ok?r.text():'').catch(()=>''));
  const texts=await Promise.all(jobs);
  const seen={};let all=[];
  texts.forEach(tx=>{
    if(!tx||tx.trim().length<20)return;
    if(seen[tx])return;seen[tx]=1;
    const rows=parseCSV(tx);
    for(let i=1;i<rows.length;i++){const p=parseSteticRow(rows[i]);if(p)all.push(p);}
  });
  return all;
}

async function fetchEnsifera(){
  try{
    const tx=await fetch('https://jkmaketing.github.io/ensifera-dashboard/?t='+Date.now())
      .then(r=>r.ok?r.text():'').catch(()=>'');
    if(!tx)return null;
    const m=tx.match(/const DATA\s*=\s*(\{[\s\S]*?\});\s*\n/);
    return m?JSON.parse(m[1]):null;
  }catch(e){return null;}
}

async function syncAll(){
  if(ST.syncing)return;
  ST.syncing=true;
  ST.loading={muebles:true,colchones:true,lili:true,stetic:true,ensifera:true};
  updateDot('loading');
  renderCurrent();

  await Promise.all([
    fetchMonthlySh('muebles',parseMueRow).then(d=>{ST.raw.muebles=d;ST.loading.muebles=false;}).catch(e=>{ST.errors.muebles=e;ST.loading.muebles=false;}),
    fetchMonthlySh('colchones',parseMueRow).then(d=>{ST.raw.colchones=d;ST.loading.colchones=false;}).catch(e=>{ST.errors.colchones=e;ST.loading.colchones=false;}),

// ============================================================
// DATE UTILS
// ============================================================
function getRange(){
  if(ST.from&&ST.to)return{from:ST.from,to:ST.to};
  const t=today();
  const d=new Date();
  const monthStart=d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-01';
  const prevMonthEnd=addDays(monthStart,-1);
  const prevMonthStart=new Date(d.getFullYear(),d.getMonth()-1,1).toISOString().slice(0,10);
  const map={
    '0':{from:t,to:t},'1':{from:addDays(t,-1),to:addDays(t,-1)},
    '7':{from:addDays(t,-6),to:t},'15':{from:addDays(t,-14),to:t},
    '30':{from:addDays(t,-29),to:t},'mes':{from:monthStart,to:t},
    'prev':{from:prevMonthStart,to:prevMonthEnd},'all':{from:'2020-01-01',to:t},
  };
  return map[ST.preset]||map['mes'];
}

function prevRange(from,to){
  const n=diffDays(from,to)+1;
  return{from:addDays(from,-n),to:addDays(from,-1)};
}

function filterRows(rows,from,to){
  if(!rows)return[];
  return rows.filter(r=>r.fecha>=from&&r.fecha<=to);
}

// ============================================================
// AGGREGATION
// ============================================================
function aggMuebles(rows,sede){
  const base=rows.filter(r=>r.sede===sede&&r.isVenta);
  const total=base.reduce((s,r)=>s+r.total,0);
  const recaudado=base.reduce((s,r)=>s+r.recaudado,0);
  const n=base.length;
  return{
    total,recaudado,saldo:total-recaudado,n,ticket:n?total/n:0,
    byOrigen:groupBy(base,r=>r.origen,r=>r.total),
    byProd:groupBy(base,r=>r.producto,r=>r.total),
    byVend:groupBy(base,r=>r.vendedor,r=>r.total),
    byDay:groupBy(base,r=>r.fecha,r=>r.total),
    rows:base,
  };
}

function aggLiliTracking(trackingRows,from,to){
  if(!trackingRows||!trackingRows.length)return null;
  const inRange=trackingRows.filter(r=>r.date>=from&&r.date<=to);
  if(!inRange.length)return null;
  const last=inRange[inRange.length-1];
  const fromMonth=from.slice(0,7);
  const prevRows=trackingRows.filter(r=>r.date<from&&r.date.startsWith(fromMonth));
  const prev=prevRows.length?prevRows[prevRows.length-1]:null;
  return{
    contactos:last.c_acum-(prev?prev.c_acum:0),
    cotizaciones:last.q_acum-(prev?prev.q_acum:0),
    ventas:last.v_acum-(prev?prev.v_acum:0),
    valor:last.val_acum-(prev?prev.val_acum:0),
  };
}

function aggLili(rows,trackingRows,from,to){
  const base=rows?rows.filter(r=>r.valida&&r.total>0):[];
  const trk=aggLiliTracking(trackingRows,from,to);
  const total=trk?trk.valor:base.reduce((s,r)=>s+r.total,0);
  const n=trk?trk.ventas:base.length;
  const contactos=trk?trk.contactos:null;
  const cotizaciones=trk?trk.cotizaciones:null;
  const conv=contactos>0?n/contactos:null;
  return{
    total,n,ticket:n?total/n:0,contactos,cotizaciones,conv,
    byCanal:groupBy(base,r=>r.canal,r=>r.total),
    byMetodo:groupBy(base,r=>r.metodoPago,r=>r.total),
    byCiudad:groupBy(base,r=>r.ciudad,r=>r.total),
    byTipo:groupBy(base,r=>r.tipo,r=>r.total),
    byDay:groupBy(base,r=>r.fecha,r=>r.total),
    rows:base,
  };
}

function aggStetic(rows){
  const asistidas=rows.filter(r=>/sí/i.test(r.asistio)&&r.valorRecaudado>0);
  const total=asistidas.reduce((s,r)=>s+r.valorRecaudado,0);
  const n=asistidas.length;
  const agendadas=rows.filter(r=>r.servicio);
  const noShow=rows.filter(r=>/no/i.test(r.asistio)).length;
  const fechas=[...new Set(rows.map(r=>r.fecha))];
  const totalChats=fechas.reduce((s,f)=>{const rw=rows.find(r=>r.fecha===f&&r.chats>0);return s+(rw?rw.chats:0);},0);
  return{
    total,n,ticket:n?total/n:0,nAgendadas:agendadas.length,noShow,totalChats,
    byServicio:groupBy(asistidas,r=>r.servicio,r=>r.valorRecaudado),
    byDay:groupBy(asistidas,r=>r.fecha,r=>r.valorRecaudado),
    rows:asistidas,allRows:rows,
  };
}

function aggEnsifera(data,from,to){
  if(!data||!data.days)return{total:0,inversion:0,n:0,ticket:0,roas:null,byDay:[],campaigns:[]};
  const days=data.days.filter(d=>d.date>=from&&d.date<=to);
  const total=days.reduce((s,d)=>s+(d.salesCOP||0),0);
  const inversion=days.reduce((s,d)=>s+(d.spendCOP||0),0);
  const n=days.reduce((s,d)=>s+(d.resultsAds||d.conversations||0),0);
  const roas=inversion>0?total/inversion:null;
  const byDay=days.map(d=>({name:d.date,val:d.salesCOP||0}));
  // aggregate campaigns across days
  const campMap={};
  days.forEach(d=>(d.campaigns||[]).forEach(c=>{if(!campMap[c.name])campMap[c.name]={name:c.name,val:0,spend:0};campMap[c.name].val+=c.results||0;campMap[c.name].spend+=c.spendCOP||0;}));
  const campaigns=Object.values(campMap).sort((a,b)=>b.spend-a.spend);
  return{total,inversion,n,ticket:n>0?total/n:0,roas,byDay,campaigns,rows:[]};
}

function clientAgg(cfg,from,to){
  if(cfg.type==='ensifera')return aggEnsifera(ST.raw.ensifera,from,to);
  const rows=filterRows(ST.raw[cfg.sheet],from,to);
  if(cfg.type==='muebles')return aggMuebles(rows,cfg.sede);
  if(cfg.type==='lili')return aggLili(rows,ST.raw.liliTracking,from,to);
  if(cfg.type==='stetic')return aggStetic(rows);
  return{total:0,n:0,ticket:0};
}

// ============================================================
// ROAS & PROJECTION
// ============================================================
function getAdv(cid,month){return pm((ST.ads[cid]||{})[month]||'0');}
function setAdv(cid,month,val){if(!ST.ads[cid])ST.ads[cid]={};ST.ads[cid][month]=val;try{localStorage.setItem('jkm_ads',JSON.stringify(ST.ads));}catch(e){}}

function calcRoas(ventaPauta,inv){if(!inv||!ventaPauta)return null;return ventaPauta/inv;}

function projection(total,from,to){
  const t=today();
  const elapsed=diffDays(from,to<t?to:t)+1;
  const avg=elapsed>0?total/elapsed:0;
  const d=new Date(t+'T00:00:00');
  const daysInMonth=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const daysLeft=daysInMonth-d.getDate();
  return{avg,monthEnd:total+avg*daysLeft,p30:total+avg*30,p90:total+avg*90};
}

// ============================================================
// CHART
// ============================================================
function trendChart(byDay,color,h=130){
  if(!byDay||!byDay.length)return`<div style="display:flex;align-items:center;justify-content:center;height:${h}px;color:var(--ink3);font-size:13px;">Sin datos en el periodo</div>`;
  const sorted=[...byDay].sort((a,b)=>a.name.localeCompare(b.name));
  const vals=sorted.map(x=>x.val);
  const maxV=Math.max(...vals,1);
  const W=Math.max(sorted.length*22,380);const H=h;
  const PL=52,PR=8,PT=8,PB=28;
  const cW=W-PL-PR,cH=H-PT-PB;
  const pts=sorted.map((x,i)=>[PL+(i/Math.max(sorted.length-1,1))*cW,(PT+(1-x.val/maxV)*cH)]);
  const pd=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const ad=pd+` L${pts[pts.length-1][0].toFixed(1)},${(PT+cH).toFixed(1)} L${PL},${(PT+cH).toFixed(1)} Z`;
  const maxIdx=vals.indexOf(Math.max(...vals));
  const step=Math.ceil(sorted.length/7);
  const uid='c'+Math.random().toString(36).slice(2,7);
  const yls=[0,.5,1].map(f=>{const y=PT+(1-f)*cH;return`<text x="${PL-4}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--ink3)">${fmt(f*maxV)}</text><line x1="${PL}" y1="${y}" x2="${PL+cW}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>`});
  const xls=sorted.map((x,i)=>{if(i%step!==0&&i!==sorted.length-1)return'';const px=PL+(i/Math.max(sorted.length-1,1))*cW;return`<text x="${px}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--ink3)">${x.name.slice(5).replace('-','/')}</text>`;});
  return`<div class="chart-wrap"><svg width="${W}" height="${H}" style="display:block;">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".2"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${yls.join('')}<path d="${ad}" fill="url(#${uid})"/><path d="${pd}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>i===maxIdx?`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="9" fill="${color}">${fmt(vals[i])}</text>`:'')}
    ${xls.join('')}
  </svg></div>`;
}

// ============================================================
// BAR RENDER
// ============================================================
function bars(items,color,max=8,showCount=false){
  if(!items||!items.length)return'<p style="color:var(--ink3);font-size:12px;padding:4px 0">Sin datos</p>';
  const top=items.slice(0,max);const mx=top[0].val||1;
  return top.map(x=>`<div class="brow">
    <div class="bmeta"><span class="bname" title="${x.name}">${x.name}</span>
    <span class="bval">${fmtF(x.val)}${showCount&&x.count?' · '+x.count+' v.':''}</span></div>
    <div class="btrack"><div class="bfill" style="width:${(x.val/mx*100).toFixed(1)}%;background:${color}"></div></div>
  </div>`).join('');
}

        <td style="text-align:right;color:${cr==null?'var(--ink2)':cr>=3?'var(--green)':cr>=1.5?'var(--gold)':'var(--red)'}">${cr!=null?cr.toFixed(2)+'×':'—'}</td></tr>`;
    }).join('');
    specific=`<div class="dgrid">
      <div class="sec"><div class="sec-ttl">Tendencia diaria inversión vs ventas</div>
        ${trendChart(agg.byDay||[],cfg.cc)}
      </div>
      <div class="sec"><div class="sec-ttl">Campañas <span>periodo seleccionado</span></div>
        ${camps.length?`<div class="twrap"><table>
          <thead><tr><th>Campaña</th><th style="text-align:right">Resultados</th><th style="text-align:right">Inversión</th><th style="text-align:right">ROAS</th></tr></thead>
          <tbody>${campRows}</tbody>
        </table></div>`:'<p style="color:var(--ink3);font-size:13px">Sin datos de campañas.</p>'}
      </div>
    </div>`;
  }

  // Table
  let tbl='<p style="color:var(--ink3);font-size:13px">Sin datos en el periodo.</p>';
  if(agg.rows&&agg.rows.length){
    const rr=[...agg.rows].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,50);
    if(cfg.type==='muebles'){
      tbl=`<div class="twrap"><table>
        <thead><tr><th>Fecha</th><th>Producto</th><th>Origen</th><th>Vendedor</th><th>Total</th><th>Recaudado</th></tr></thead>
        <tbody>${rr.map(r=>`<tr><td>${r.fecha.slice(5).replace('-','/')}</td><td>${r.producto}</td>
          <td><span class="chip" style="background:var(--card2)">${r.origen}</span></td>
          <td>${r.vendedor}</td><td>${fmtF(r.total)}</td>
          <td style="color:var(--green)">${fmtF(r.recaudado)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    } else if(cfg.type==='lili'){
      tbl=`<div class="twrap"><table>
        <thead><tr><th>Fecha</th><th>Cliente</th><th>Ciudad</th><th>Canal</th><th>Tipo</th><th>Estado</th><th>Total</th></tr></thead>
        <tbody>${rr.map(r=>`<tr><td>${r.fecha.slice(5).replace('-','/')}</td><td>${r.cliente||'—'}</td><td>${r.ciudad||'—'}</td>
          <td>${r.canal||'—'}</td><td>${r.tipo||'—'}</td>
          <td><span class="chip" style="background:${r.estado==='Entregada'||r.estado==='entregada'?'#3ecf8e22':'var(--card2)'};">${r.estado}</span></td>
          <td>${fmtF(r.total)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    } else if(cfg.type==='stetic'){
      tbl=`<div class="twrap"><table>
        <thead><tr><th>Fecha</th><th>Cliente</th><th>Servicio</th><th>Asistió</th><th>Agendado</th><th>Recaudado</th></tr></thead>
        <tbody>${rr.map(r=>`<tr><td>${r.fecha.slice(5).replace('-','/')}</td><td>${r.cliente||'—'}</td><td>${r.servicio||'—'}</td>
          <td><span class="chip" style="background:${/sí/i.test(r.asistio)?'#3ecf8e22':/no/i.test(r.asistio)?'#f5656522':'var(--card2)'};">${r.asistio||'—'}</span></td>
          <td>${fmtF(r.valorAgendado)}</td><td style="color:var(--green)">${fmtF(r.valorRecaudado)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    }
  }

  return`<div class="dhdr">
    <button class="backbtn" onclick="goHome()">← Panel</button>
    <div class="dstripe" style="--cc:${cfg.cc}"></div>
    <div><div class="dtitle">${cfg.icon} ${cfg.name}</div><div class="dsub">${cfg.sub}</div></div>
    <div style="margin-left:auto">${pb}</div>
  </div>

  <div class="krow">
    <div class="ktile"><div class="kt-lbl">Venta total</div><div class="kt-val">${fmt(agg.total||0)}</div>
      <div class="kt-sub">${p!=null?`<span style="color:${p>=0?'var(--green)':'var(--red)'}">${fmtPct(p)}</span> vs periodo ant.`:''}</div></div>
    <div class="ktile"><div class="kt-lbl">${isEnsifera?'Conversiones':'Ventas / Pedidos'}</div><div class="kt-val">${agg.n||0}</div>
      <div class="kt-sub">${aggP.n?`Anterior: ${aggP.n}`:''}</div></div>
    ${cfg.type==='lili'&&agg.contactos!=null?`<div class="ktile"><div class="kt-lbl">Contactos</div><div class="kt-val">${agg.contactos}</div>
      <div class="kt-sub">${agg.cotizaciones!=null?`Cotiz: ${agg.cotizaciones}`:''}</div></div>
    <div class="ktile"><div class="kt-lbl">Conversión</div><div class="kt-val" style="color:${agg.conv>=0.07?'var(--green)':agg.conv>=0.04?'var(--gold)':'var(--red)'}">${agg.conv!=null?(agg.conv*100).toFixed(1)+'%':'—'}</div>
      <div class="kt-sub">Contactos → ventas</div></div>`:''}
    <div class="ktile"><div class="kt-lbl">Ticket promedio</div><div class="kt-val">${fmt(agg.ticket||0)}</div>
      <div class="kt-sub">${aggP.ticket?`Ant: ${fmt(aggP.ticket)}`:''}</div></div>
    ${cfg.type==='muebles'?`<div class="ktile"><div class="kt-lbl">Recaudado</div><div class="kt-val grn">${fmt(agg.recaudado||0)}</div>
      <div class="kt-sub" style="color:var(--gold)">Saldo: ${fmt(agg.saldo||0)}</div></div>`:''}
    <div class="ktile"><div class="kt-lbl">ROAS</div><div class="kt-val" style="color:${roasColor}">${roas?roas.toFixed(2)+'×':'—'}</div>
      <div class="kt-sub">${inv?'Inv. '+fmtF(inv):'Sin inversión'}</div></div>
    <div class="ktile"><div class="kt-lbl">Proy. fin de mes</div><div class="kt-val gld">${fmt(prj.monthEnd)}</div>
      <div class="kt-sub">Prom. ${fmt(prj.avg)}/día</div></div>
  </div>

  <div class="sec" style="margin-bottom:12px">
    <div class="sec-ttl">Tendencia de ventas</div>
    ${trendChart(agg.byDay||[],cfg.cc)}
  </div>

  <div class="pstrip">
    <div class="pitem"><div class="pi-lbl">Cierre del mes</div><div class="pi-val">${fmt(prj.monthEnd)}</div></div>
    <div class="pitem"><div class="pi-lbl">+30 días</div><div class="pi-val">${fmt(prj.p30)}</div></div>
    <div class="pitem"><div class="pi-lbl">+90 días</div><div class="pi-val">${fmt(prj.p90)}</div></div>
    <div class="pitem"><div class="pi-lbl">Prom. diario</div><div class="pi-val">${fmt(prj.avg)}</div></div>
  </div>

  ${specific}

  <div class="sec" style="margin-bottom:12px">
    ${isEnsifera?`
    <div class="sec-ttl">Inversión en Ads · ROAS <span>datos en vivo desde Ensífera Dashboard</span></div>
    <div class="roas-grid">
      <div class="rrow">
        <div class="r-lbl">Inversión real (Meta Ads)</div>
        <div style="font-size:22px;font-weight:800;margin:6px 0">${fmtF(agg.inversion||0)}</div>
        <div class="rres"><span>ROAS</span><span class="rresv" style="color:${roasColor}">${roas?roas.toFixed(2)+'×':'—'}</span></div>
        <div class="rres" style="margin-top:3px"><span>Costo × conversión</span><span class="rresv">${cpv?fmtF(cpv):'—'}</span></div>
      </div>
      <div class="rrow" style="display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);margin-bottom:6px">Ventas atribuidas (periodo)</div>
        <div style="font-size:22px;font-weight:800">${fmt(agg.total||0)}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:4px">ROAS = venta ÷ inversión real</div>
      </div>
    </div>`:`
    <div class="sec-ttl">Inversión en Ads · ROAS <span>inversión fija mensual</span></div>
    <div class="mtabs">${mtabs}</div>
    <div class="roas-grid">
      <div class="rrow">
        <div class="r-lbl">Inversión mensual fija</div>
        <div style="font-size:22px;font-weight:800;margin:6px 0;color:var(--ink1)">${fmtF(INVERSION_FIJA[cid]||0)}</div>
        <div class="rres"><span>ROAS</span><span class="rresv" style="color:${roasColor}">${roas?roas.toFixed(2)+'×':'—'}</span></div>
        <div class="rres" style="margin-top:3px"><span>Costo × venta</span><span class="rresv">${cpv?fmtF(cpv):'—'}</span></div>
      </div>
      <div class="rrow" style="display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);margin-bottom:6px">
          ${cfg.type==='muebles'?'Venta por pauta (origen PAUTA)':'Venta total en periodo'}
        </div>
        <div style="font-size:22px;font-weight:800">${fmt(pauta)}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:4px">ROAS = venta ÷ inversión</div>
      </div>
    </div>`}
  </div>

  ${isEnsifera?'':`<div class="sec">
    <div class="sec-ttl">Detalle de pedidos <span>últimos 50</span></div>
    ${tbl}
  </div>`}`;
}

// ============================================================
// NAVIGATION
// ============================================================
function drillDown(cid){ST.view=cid;renderCurrent();window.scrollTo(0,0);}
function goHome(){ST.view='home';renderCurrent();}

function setPreset(p){ST.preset=p;ST.from='';ST.to='';renderCurrent();}

function updateDot(state){
  const dot=$('sdot');const lbl=$('slbl');if(!dot)return;
  dot.className='dot'+(state==='loading'?' loading':state==='err'?' err':'');
  lbl.textContent=state==='loading'?'Sincronizando…':ST.lastSync?'Sincronizado '+new Date(ST.lastSync).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}):'Sin datos';
}

// ============================================================
// RENDER
// ============================================================
function renderDateBar(){
  const presets=[{k:'0',l:'Hoy'},{k:'1',l:'Ayer'},{k:'7',l:'7 días'},{k:'15',l:'15 días'},{k:'30',l:'30 días'},{k:'mes',l:'Este mes'},{k:'prev',l:'Mes ant.'},{k:'all',l:'Todo'}];
  const btns=presets.map(p=>`<button class="pb ${ST.preset===p.k&&!ST.from?'on':''}" onclick="setPreset('${p.k}')">${p.l}</button>`).join('');
  const{from,to}=getRange();
  $('dbar').innerHTML=`<div style="display:flex;gap:4px;flex-wrap:wrap">${btns}</div>
    <span class="dsep">|</span>
    <div class="dright">
      <input class="dinput" type="date" value="${ST.from||from}" max="${today()}" onchange="ST.from=this.value;ST.preset='';renderCurrent()">
      <span style="color:var(--ink3);font-size:12px">→</span>
      <input class="dinput" type="date" value="${ST.to||to}" max="${today()}" onchange="ST.to=this.value;ST.preset='';renderCurrent()">
    </div>`;
}

function renderCurrent(){
  renderDateBar();
  const c=$('app');if(!c)return;
  c.innerHTML=ST.view==='home'?renderHome():renderDetail(ST.view);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded',()=>{
  document.documentElement.setAttribute('data-theme',ST.theme);
  $('tbtn').textContent=ST.theme==='dark'?'☀':'🌙';

  $('tbtn').addEventListener('click',()=>{
    ST.theme=ST.theme==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',ST.theme);
    localStorage.setItem('jkm_theme',ST.theme);
    $('tbtn').textContent=ST.theme==='dark'?'☀':'🌙';
  });
  $('syncbtn').addEventListener('click',syncAll);

  ST.preset='mes';
  renderCurrent();
  syncAll();
  setInterval(syncAll,300000);
});
</script>

<div class="hdr">
  <div class="hdr-logo">JK <em>Marketing</em></div>
  <div class="hdr-spacer"></div>
  <div class="sync-row">
    <div class="dot loading" id="sdot"></div>
    <span class="sync-lbl" id="slbl">Conectando…</span>
  </div>
  <button class="hdr-btn" id="syncbtn">⟳ Sincronizar</button>
  <button class="hdr-btn" id="tbtn">☀</button>
</div>

<div class="dbar" id="dbar"></div>

<div class="main">
  <div id="app"></div>
</div>
