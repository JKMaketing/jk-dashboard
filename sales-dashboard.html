<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ventas · JK Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--surface3:#21262d;
  --border:#30363d;--text:#e6edf3;--muted:#8b949e;--muted2:#6e7681;
  --green:#3fb950;--red:#f78166;--yellow:#e3b341;--blue:#58a6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh}
#app{display:flex;min-height:100vh}
aside{width:224px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0}
main{flex:1;overflow-y:auto;padding:24px 28px}
.brand{padding:0 16px 16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.brand h1{font-size:14px;font-weight:700}
.brand p{font-size:11px;color:var(--muted);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;color:var(--muted);font-size:13px;font-weight:500}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{color:var(--text);border-left-color:var(--accent,#58a6ff);background:var(--surface2)}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-sep{height:1px;background:var(--border);margin:8px 16px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted2);padding:8px 16px 4px}
/* Overview */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:border-color .2s,transform .15s}
.ov-card:hover{border-color:var(--chex);transform:translateY(-1px)}
.ov-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ov-dot{width:8px;height:8px;border-radius:50%}
.ov-name{font-weight:600;font-size:13px}
.ov-sector{font-size:11px;color:var(--muted);margin-left:auto}
.ov-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ov-stat-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.ov-stat-l{font-size:10px;color:var(--muted);margin-top:1px}
/* Page */
.page-header{margin-bottom:20px}
.page-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-title h2{font-size:20px;font-weight:700}
.badge{font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px}
.page-note{margin-top:8px;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;line-height:1.5}
.est-note{margin-top:6px;font-size:11px;color:var(--yellow);background:#e3b34112;border:1px solid #e3b34133;border-radius:6px;padding:6px 12px}
/* Date filter */
.date-filter{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.date-filter label{font-size:11px;color:var(--muted);white-space:nowrap}
.date-filter select,.date-filter input[type="date"]{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:12px;outline:none;cursor:pointer;transition:border-color .15s;color-scheme:dark}
.date-filter select:focus,.date-filter input[type="date"]:focus{border-color:var(--accent,#58a6ff)}
.date-filter-pair{display:flex;align-items:center;gap:8px}
.filter-stats{font-size:11px;color:var(--muted);margin-left:auto}
.btn-reset{background:none;border:1px solid var(--border);border-radius:5px;padding:5px 10px;color:var(--muted);font-size:11px;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:var(--surface2);color:var(--text)}
/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px}
.kpi-value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}
/* ROAS */
.roas-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px}
.roas-panel h3{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
.roas-inner{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.roas-field{display:flex;flex-direction:column;gap:4px}
.roas-field label{font-size:11px;color:var(--muted)}
.roas-field input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:13px;width:170px;outline:none;transition:border-color .15s}
.roas-field input:focus{border-color:var(--accent,#58a6ff)}
.roas-results{display:flex;gap:10px;flex-wrap:wrap}
.roas-stat{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;min-width:110px}
.roas-stat-v{font-size:18px;font-weight:700}
.roas-stat-l{font-size:10px;color:var(--muted);margin-top:2px}
/* Charts */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:900px){.charts-row{grid-template-columns:1fr}}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
.chart-card h3{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:14px}
.chart-wrap{position:relative;height:240px}
/* Ventas Hoy */
.hoy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:24px}
.hoy-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px}
.hoy-card-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.hoy-card-name{font-weight:600;font-size:13px;flex:1}
.hoy-card-date{font-size:10px;color:var(--muted)}
.hoy-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hoy-field{display:flex;flex-direction:column;gap:4px}
.hoy-field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.hoy-field input{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:7px 8px;color:var(--text);font-size:13px;font-weight:600;outline:none;text-align:center;width:100%;transition:border-color .15s}
.hoy-field input:focus{border-color:var(--hoy-color,#58a6ff)}
.hoy-saved{font-size:10px;color:var(--green);margin-top:8px;min-height:14px;text-align:right}
.hoy-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.hoy-total-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.hoy-total-v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hoy-total-l{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
/* Table */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
.table-card h3{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:14px 16px;border-bottom:1px solid var(--border)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--surface2);font-weight:600;white-space:nowrap}
.data-table td{padding:9px 12px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums;font-size:12px}
.data-table tr:hover td{background:var(--surface2)}
.data-table .num{text-align:right}
.data-table tfoot tr td{background:var(--surface2);font-weight:700;border-top:2px solid var(--border)}
.row-est td{color:var(--yellow)!important;opacity:.75}
/* Canal bars */
.canal-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:20px}
.canal-card h3{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:14px}
.canal-bars{display:flex;flex-direction:column;gap:10px}
.canal-row{display:flex;align-items:center;gap:10px}
.canal-name{width:160px;font-size:12px;flex-shrink:0}
.canal-track{flex:1;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}
.canal-fill{height:100%;border-radius:4px}
.canal-val{font-size:12px;font-variant-numeric:tabular-nums;width:40px;text-align:right;flex-shrink:0;color:var(--muted)}
.section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted2);margin-bottom:12px}
@media(max-width:700px){aside{display:none}main{padding:16px}}
</style>
</head>
<body>
<div id="app">
<aside>
  <div class="brand">
    <h1>JK Marketing</h1>
    <p>Dashboard de Ventas</p>
    <div id="live-badge" style="font-size:10px;color:var(--muted);margin-top:5px"></div>
    <button onclick="fetchLiveData()" style="margin-top:6px;background:none;border:1px solid var(--border);border-radius:5px;padding:3px 8px;color:var(--muted);font-size:10px;cursor:pointer;width:100%">↺ Actualizar datos</button>
  </div>
  <span class="nav-label">General</span>
  <div class="nav-item" id="nav-overview" onclick="showOverview()"><span>📊</span> Resumen general</div>
  <div class="nav-item" id="nav-hoy" onclick="showVentasHoy()" style="--accent:#3fb950"><span>📅</span> Ventas Hoy</div>
  <div class="nav-sep"></div>
  <span class="nav-label">El Rey</span>
  <div class="nav-item" id="nav-elrey" onclick="showElReyGeneral()" style="--accent:#ffa657">

  </div>

  <span class="nav-label">Clientes</span>

</aside>
<main id="main"></main>
</div>

<script>
// ── API EN VIVO ────────────────────────────────────────────────────────
// Pega aquí la URL del Apps Script después de desplegarlo
const LIVE_API_URL = 'https://script.google.com/macros/s/AKfycbzumgZtjjKp9XRA9rJcz2lWrRDt4XgpDgabJxT6iXHmfkJuVTjj4yvlK2vMckT4V0pNBw/exec';

let liveData = null;
let lastFetch = null;
let fetchState = 'idle'; // 'idle' | 'loading' | 'ok' | 'error'

async function fetchLiveData(silent = false) {
  if (!LIVE_API_URL) return;
  fetchState = 'loading';
  updateLiveBadge();
  try {
    const res = await fetch(LIVE_API_URL, { cache: 'no-store' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    liveData = json;
    lastFetch = new Date();
    fetchState = 'ok';
    // Merge live data into El Rey cuadre
    if (json.elrey) mergeLiveElRey(json.elrey);
    if (json.lili_jun26) mergeLiveLili(json.lili_jun26);
    if (!silent) reRenderCurrent();
  } catch (e) {
    fetchState = 'error';
    console.warn('Live data fetch failed:', e);
  }
  updateLiveBadge();
}

function mergeLiveElRey(data) {
  const d = EL_REY_CUADRE;
  // Proyección
  if (data.proyeccion) {
    const p = data.proyeccion;
    if (p.diasLaborados)  d.diasLaborados     = p.diasLaborados;
    if (p.proyVentas)     d.proyeccion_u      = p.proyVentas;
    if (p.proyRecaudo)    d.proyeccion_v      = p.proyRecaudo;
    if (p.promedioDiario) d.promedioDiario_v  = p.promedioDiario;
    if (p.fechaCorte)     d.fechaCorte        = p.fechaCorte;
  }
  // Sedes actuales
  if (data.sedes_actual && data.sedes_actual.length) {
    data.sedes_actual.forEach(s => {
      const sede = d.sedes.find(x => x.name.toUpperCase() === String(s.name).toUpperCase());
      if (sede) { sede.actual_u = s.cantidad; sede.actual_v = s.valor; }
    });
  }
  // Metas de sedes (desde Informe_Mes)
  if (data.metas_sedes && data.metas_sedes.length) {
    data.metas_sedes.forEach(s => {
      const sede = d.sedes.find(x => x.name.toUpperCase() === String(s.name).toUpperCase());
      if (sede) { sede.meta_u = s.meta_u; sede.meta_v = s.meta_v; }
    });
  }
  // Asesores actuales
  if (data.asesores_actual && data.asesores_actual.length) {
    data.asesores_actual.forEach(a => {
      const asesor = d.asesores.find(x => x.name.toUpperCase() === String(a.name).toUpperCase());
      if (asesor) { asesor.actual_u = a.cantidad; asesor.actual_v = a.valor; }
    });
  }
  // Metas de asesores
  if (data.metas_asesores && data.metas_asesores.length) {
    data.metas_asesores.forEach(a => {
      const asesor = d.asesores.find(x => x.name.toUpperCase() === String(a.name).toUpperCase());
      if (asesor) asesor.meta_v = a.meta;
    });
  }
  // Productos
  if (data.productos && data.productos.length) {
    d.productos = data.productos.map(p => ({ name: p.name, u: p.cantidad, v: p.valor }));
  }
  // Formas de pago
  if (data.pagos && data.pagos.length) {
    d.pagos = data.pagos.map(p => ({ name: p.name, v: p.valor }));
  }
  // Diario
  if (data.diario && data.diario.length) {
    d.diario = data.diario;
  }
}

function mergeLiveLili(tabs) {
  // tabs es array: [{tab:'Jun 26', contactos, cotizaciones, ventas, valor}, ...]
  tabs.forEach(t => {
    const mes = t.tab; // e.g. "Jun 26"
    const client = CLIENTS.find(c => c.id === 'lili');
    if (!client) return;
    const existing = client.data.find(d => d.mes === mes);
    if (existing) {
      existing.contactos   = t.contactos;
      existing.cotizaciones= t.cotizaciones;
      existing.ventas      = t.ventas;
      existing.valor       = t.valor;
    }
  });
}

let currentView = { type: 'overview' };
function reRenderCurrent() {
  if (currentView.type === 'overview')      showOverview();
  else if (currentView.type === 'client')   showClient(currentView.idx);
  else if (currentView.type === 'elrey')    showElReyGeneral();
  else if (currentView.type === 'hoy')      showVentasHoy();
}

function updateLiveBadge() {
  const el = document.getElementById('live-badge');
  if (!el) return;
  if (!LIVE_API_URL) {
    el.innerHTML = '';
    return;
  }
  const icons = { idle:'⚪', loading:'🔄', ok:'🟢', error:'🔴' };
  const labels = { idle:'', loading:' actualizando…', ok:' en vivo', error:' sin conexión' };
  const t = lastFetch ? lastFetch.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '';
  el.innerHTML = `<span title="Última actualización: ${t || '—'}">${icons[fetchState]}${labels[fetchState]}${t?' · '+t:''}</span>`;
}

const M  = n => '$'+Math.round(n).toLocaleString('es-CO');
const Ms = n => n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(0)+'K':M(n);
const Nf = n => n.toLocaleString('es-CO');

// Month index for ordering/filtering
function mesIdx(m){
  const order=['Ene 25','Feb 25','Mar 25','Abr 25','May 25','Jun 25','Jul 25','Ago 25','Sep 25','Oct 25','Nov 25','Dic 25',
               'Ene 26','Feb 26','Mar 26','Abr 26','May 26','Jun 26','Jul 26','Ago 26','Sep 26','Oct 26','Nov 26','Dic 26'];
  const i=order.indexOf(m);
  return i>=0?i:999;
}

function getAllMonths(){
  const set=new Set();
  CLIENTS.forEach(c=>c.data.forEach(d=>set.add(d.mes)));
  return [...set].sort((a,b)=>mesIdx(a)-mesIdx(b));
}

function calcKPIs(data){
  const full=data.filter(d=>!d.parcial&&!d.est);
  const tv=data.reduce((s,d)=>s+d.valor,0);
  const tn=data.reduce((s,d)=>s+d.ventas,0);
  const tc=data.reduce((s,d)=>s+d.contactos,0);
  const tq=data.reduce((s,d)=>s+d.cotizaciones,0);
  const ticket=tn>0?tv/tn:0;
  const cierre=tc>0?tn/tc*100:0;
  const src=full.length?full:data;
  const best=src.length?src.reduce((a,b)=>a.valor>b.valor?a:b,src[0]):null;
  const last=data[data.length-1];
  const prev=data[data.length-2];
  const mom=(prev&&prev.valor>0&&!last.parcial&&!last.est)?(last.valor-prev.valor)/prev.valor*100:null;
  return{tv,tn,tc,tq,ticket,cierre,best,last,mom};
}

function getMonthInv(id,mes){return parseFloat(localStorage.getItem('inv_'+id+'_'+mes)||'0')}
function setMonthInv(id,mes,v){localStorage.setItem('inv_'+id+'_'+mes,v)}
function getTotalInv(id,data){return data.reduce((s,d)=>s+getMonthInv(id,d.mes),0)}

function getInv(id){return getTotalInv(id,CLIENTS.find(c=>c.id===id)?.data||[])}

// ── DATE FILTER STATE ─────────────────────────────────────────────────
let filterFrom='', filterTo='';

// Map "Mes YY" → [YYYY-MM-01, YYYY-MM-DD_last]
function mesToDateRange(mes){
  const map={
    'Ene 25':['2025-01-01','2025-01-31'],'Feb 25':['2025-02-01','2025-02-28'],
    'Mar 25':['2025-03-01','2025-03-31'],'Abr 25':['2025-04-01','2025-04-30'],
    'May 25':['2025-05-01','2025-05-31'],'Jun 25':['2025-06-01','2025-06-30'],
    'Jul 25':['2025-07-01','2025-07-31'],'Ago 25':['2025-08-01','2025-08-31'],
    'Sep 25':['2025-09-01','2025-09-30'],'Oct 25':['2025-10-01','2025-10-31'],
    'Nov 25':['2025-11-01','2025-11-30'],'Dic 25':['2025-12-01','2025-12-31'],
    'Ene 26':['2026-01-01','2026-01-31'],'Feb 26':['2026-02-01','2026-02-28'],
    'Mar 26':['2026-03-01','2026-03-31'],'Abr 26':['2026-04-01','2026-04-30'],
    'May 26':['2026-05-01','2026-05-31'],'Jun 26':['2026-06-01','2026-06-30'],
    'Jul 26':['2026-07-01','2026-07-31'],'Ago 26':['2026-08-01','2026-08-31'],
    'Sep 26':['2026-09-01','2026-09-30'],'Oct 26':['2026-10-01','2026-10-31'],
    'Nov 26':['2026-11-01','2026-11-30'],'Dic 26':['2026-12-01','2026-12-31'],
  };
  return map[mes]||[null,null];
}

function getFilteredData(data){
  if(!filterFrom&&!filterTo) return data;
  return data.filter(d=>{
    const [ms,me]=mesToDateRange(d.mes);
    if(!ms) return true;
    if(filterFrom&&me<filterFrom) return false;  // month ends before start
    if(filterTo&&ms>filterTo)    return false;  // month starts after end
    return true;
  });
}

function buildDateFilter(clientData, clientColor){
  const ranges=clientData.map(d=>mesToDateRange(d.mes));
  const starts=ranges.map(r=>r[0]).filter(Boolean).sort();
  const ends=ranges.map(r=>r[1]).filter(Boolean).sort();
  const minDate=starts[0]||'2025-01-01';
  const maxDate=ends[ends.length-1]||'2026-12-31';
  const fromVal=filterFrom||minDate;
  const toVal=filterTo||maxDate;
  return`<div class="date-filter" style="--accent:${clientColor}">
    <div class="date-filter-pair">
      <label>Desde</label>
      <input type="date" id="df-from" onchange="onFilter()" value="${fromVal}" min="${minDate}" max="${maxDate}">
    </div>
    <div class="date-filter-pair">
      <label>Hasta</label>
      <input type="date" id="df-to" onchange="onFilter()" value="${toVal}" min="${minDate}" max="${maxDate}">
    </div>
    <button class="btn-reset" onclick="resetFilter()">Mostrar todo</button>
    <span class="filter-stats" id="filter-stats"></span>
  </div>`;
}

let _activeClientIdx = 0;
function onFilter(){
  const from=document.getElementById('df-from');
  const to=document.getElementById('df-to');
  if(from&&to){
    filterFrom=from.value;
    filterTo=to.value;
    refreshClientView(_activeClientIdx);
  }
}
function resetFilter(){
  filterFrom='';filterTo='';
  refreshClientView(_activeClientIdx);
}

      // Update this row's ROAS cell
      const d=fdata.find(x=>x.mes===mes);
      const cell=document.getElementById('roas-'+mes.replace(' ','_'));
      if(cell&&d){
        if(v>0){
          const r=(d.valor/v).toFixed(2);
          const col=parseFloat(r)>=4?'var(--green)':parseFloat(r)>=2?'var(--yellow)':'var(--red)';
          cell.textContent='x'+r;
          cell.style.color=col;
        } else { cell.textContent='—'; cell.style.color=''; }
      }
      recalcRoasSummary();
    });
  });
  recalcRoasSummary();

  // Restore filter selects
  const f=document.getElementById('df-from');
  const t=document.getElementById('df-to');
  const months=allData.map(d=>d.mes);
  if(f&&filterFrom&&months.includes(filterFrom)) f.value=filterFrom;
  if(t&&filterTo&&months.includes(filterTo)) t.value=filterTo;

  // Stats label
  const st=document.getElementById('filter-stats');
  if(st){
    const isFiltered=filterFrom||filterTo;
    if(isFiltered){
      const fmtD=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'2-digit'}):'';
      st.textContent=`${fdata.length} de ${allData.length} meses · ${Ms(k.tv)} · ${fmtD(filterFrom)} → ${fmtD(filterTo)}`;
    } else { st.textContent=''; }
  }

  // Line chart
  const labels=fdata.map(d=>d.mes);
  reg(new Chart(document.getElementById('chartLine'),{
    type:'line',
    data:{labels,datasets:[{
      label:'Valor',
      data:fdata.map(d=>d.valor),
      borderColor:fdata.map(d=>d.est?c.color+'55':c.color),
      backgroundColor:c.color+'20',fill:true,tension:.4,
      pointRadius:4,
      pointBackgroundColor:fdata.map(d=>d.parcial?c.color+'77':d.est?c.color+'55':c.color),
      pointStyle:fdata.map(d=>d.parcial?'triangle':d.est?'rect':'circle'),
      segment:{borderColor:ctx=>fdata[ctx.p1DataIndex]?.est?c.color+'55':c.color}
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8b949e',font:{size:11},boxWidth:10}},
        tooltip:{callbacks:{label:ctx=>' '+M(ctx.raw)+(fdata[ctx.dataIndex]?.est?' (est.)':'')}}},
      scales:{x:G.x,y:{...G.y,ticks:{...G.y.ticks,callback:v=>Ms(v)}}}}
  }));

  reg(new Chart(document.getElementById('chartBar'),{
    type:'bar',
    data:{labels,datasets:[
      {label:'Contactos',data:fdata.map(d=>d.contactos),backgroundColor:fdata.map(d=>d.est?'#30363d55':'#30363d'),borderRadius:3},
      {label:'Cotizaciones',data:fdata.map(d=>d.cotizaciones),backgroundColor:fdata.map(d=>d.est?'#388bfd22':'#388bfd44'),borderRadius:3},
      {label:'Ventas',data:fdata.map(d=>d.ventas),backgroundColor:fdata.map(d=>d.est?c.color+'44':c.color+'bb'),borderRadius:3},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8b949e',font:{size:11},boxWidth:10}}},
      scales:{x:G.x,y:G.y}}
  }));

  if(c.canalChart&&document.getElementById('chartCanal')){
    reg(new Chart(document.getElementById('chartCanal'),{
      type:'bar',
      data:{

        datasets:c.canalChart.datasets.map(ds=>({

        plugins:{legend:{labels:{color:'#8b949e',font:{size:11},boxWidth:10}}},
        scales:{x:G.x,y:{...G.y,ticks:{...G.y.ticks,callback:v=>Ms(v)}}}}

function updateRoasSummary(id,inv,k){
  const el=document.getElementById('roas-results');
  if(!el)return;
  if(!inv||inv<=0){
    el.innerHTML=`<div class="roas-stat"><div class="roas-stat-v" style="color:var(--muted)">—</div><div class="roas-stat-l">Ingresa inversión en la tabla ↓</div></div>`;
    return;
  }
  const roas=k.tv/inv;
  const cpv=k.tn>0?inv/k.tn:0;
  const ganancia=k.tv-inv;
  const roasColor=roas>=4?'var(--green)':roas>=2?'var(--yellow)':'var(--red)';
  el.innerHTML=`
    <div class="roas-stat">
      <div class="roas-stat-v" style="color:${roasColor}">x${roas.toFixed(2)}</div>
      <div class="roas-stat-l">ROAS total</div>
    </div>
    <div class="roas-stat">
      <div class="roas-stat-v">${M(inv)}</div>
      <div class="roas-stat-l">Total invertido</div>
    </div>
    <div class="roas-stat">
      <div class="roas-stat-v" style="color:${ganancia>=0?'var(--green)':'var(--red)'}">${Ms(ganancia)}</div>
      <div class="roas-stat-l">Ganancia neta</div>
    </div>
    <div class="roas-stat">
      <div class="roas-stat-v">${Ms(cpv)}</div>
      <div class="roas-stat-l">Costo por venta</div>
    </div>`;
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getDailyEntry(clientId) {
  const raw = localStorage.getItem('hoy_'+clientId+'_'+todayKey());
  return raw ? JSON.parse(raw) : {contactos:0, ventas:0, valor:0};
}
function setDailyEntry(clientId, obj) {
  localStorage.setItem('hoy_'+clientId+'_'+todayKey(), JSON.stringify(obj));
}

        <thead><tr>
          <th>Fecha</th><th class="num">Ventas</th><th class="num">Precio total</th>
          <th class="num">Recaudado</th><th class="num">Pendiente</th>
        </tr></thead>
        <tbody>${diarioRows}</tbody>
      </table>
    </div>` : ''}
  `;
}

function onHoyInput(input) {
  const clientId = input.dataset.client;
  const field = input.dataset.field;
  const val = parseFloat(input.value) || 0;
  const entry = getDailyEntry(clientId);
  entry[field] = val;
  setDailyEntry(clientId, entry);

  // Update saved indicator
  const saved = document.getElementById('hoy-saved-'+clientId);
  if (saved) saved.textContent = '✓ Guardado';

  // Recalc totals
  const allEntries = CLIENTS.map(c => getDailyEntry(c.id));
  const totC = allEntries.reduce((s,e)=>s+e.contactos,0);
  const totV = allEntries.reduce((s,e)=>s+e.ventas,0);
  const totVal = allEntries.reduce((s,e)=>s+e.valor,0);
  const elC = document.getElementById('hoy-tot-c');
  const elV = document.getElementById('hoy-tot-v');
  const elVal = document.getElementById('hoy-tot-val');
  if(elC) elC.textContent = totC ? Nf(totC) : '—';
  if(elV) elV.textContent = totV ? Nf(totV) : '—';
  if(elVal) elVal.textContent = totVal ? Ms(totVal) : '—';
}

buildSidebar();
showOverview();

// Fetch live data on load, then every 5 minutes
fetchLiveData(true);
setInterval(() => fetchLiveData(true), 5 * 60 * 1000);
</script>
</body>
</html>
